[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unseen"
version = "0.1.0"
description = "Scan web pages for hidden text and instructions aimed at AI agents (indirect prompt injection)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Manaal" }]
keywords = ["security", "prompt-injection", "llm", "ai-agents", "scanner", "osint"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
render = ["playwright>=1.45"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
unseen = "unseen.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/unseen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]